# Media Quality Checker — varsayılan eşikler
# CLI flag'leri (--blur-threshold, --min-brightness, vs.) bu değerleri ezer.

# Quality Check Thresholds
quality:
  # Blur (Laplacian variance) — düşük = bulanık
  blur_threshold: 100

  # Brightness (mean pixel 0-255)
  brightness:
    min: 30    # Altı çok karanlık
    max: 225   # Üstü çok parlak/yanık

  # Contrast (standard deviation) — düşük = düz/soluk
  contrast_threshold: 15

  # BPP (bytes per pixel) — düşük = aşırı sıkıştırılmış
  bpp:
    min: 0.1

# Metadata İşleme (opsiyonel, MetadataProcessor için)
metadata:
  auto_orient: true
  strip_metadata: true
  convert_to_srgb: true
  preserve_icc: false
