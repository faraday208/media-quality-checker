[project]
name = "image-quality-checker"
version = "0.1.0"
description = "Image quality assessment: blur, brightness, contrast, BPP, metadata checks"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "faraday208" }]
keywords = ["image", "quality", "blur", "dataset", "preprocessing"]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "tqdm>=4.65.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
